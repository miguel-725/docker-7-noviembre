services:
  db:
    image: postgres:16
    container_name: cafeteria
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: pishi4017
      POSTGRES_DB: cafeteria_unifranz
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  pgdata: